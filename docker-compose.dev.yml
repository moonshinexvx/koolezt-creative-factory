services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creative_factory
      POSTGRES_USER: creative_factory
      POSTGRES_PASSWORD: creative_factory
    ports: ["5432:5432"]
    volumes: ["creative_factory_postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  creative_factory_postgres:
